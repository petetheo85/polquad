[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polquad"
version = "1.0.0"
description = "Computational Processing of Political Bias Using AI Agents (Journal of Information Security, 2026)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Peter Theodoracopoulos" }
]
keywords = [
    "multi-agent",
    "agentic-ai",
    "llm-guardrails",
    "bias-mitigation",
    "nlp",
    "ai-alignment"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "google-genai>=0.1.1,<1.0.0",
    "openai>=1.50.0,<2.0.0",
    "anthropic>=0.36.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
    "datasets>=3.0.0,<4.0.0",
    "colorama>=0.4.6,<0.5.0",
    "tqdm>=4.66.0,<5.0.0",
    "scipy>=1.14.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-mock>=3.14.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.ArbitraryTypeWarning:pydantic._internal._generate_schema",
]